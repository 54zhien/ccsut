name: Payment model crash investigation
on:
  workflow_dispatch:
  push:
    branches: [codex/payment-model-crash]
    paths: ['.github/workflows/payment-model-diagnostics.yml']
jobs:
  investigate:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        diagnostic: [main-thread, guard-malloc]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check native framework calls and allocation lifetime
        env:
          DIAGNOSTIC: ${{ matrix.diagnostic }}
        run: |
          set -e
          git show 538a32a:ios/Tests/EcardPaymentModelTests.swift > "$RUNNER_TEMP/EcardPaymentModelTests.swift"
          SOURCES=(ios/CCSUT/Session.swift ios/CCSUT/API.swift ios/CCSUT/APIResponse.swift ios/CCSUT/Models.swift
            ios/CCSUT/EnrolledCourses.swift ios/CCSUT/ElectiveState.swift
            ios/CCSUT/AcademicAPI.swift ios/CCSUT/AcademicCalendar.swift ios/CCSUT/SchedulePresentation.swift
            ios/CCSUT/EcardAPI.swift ios/CCSUT/EcardTokenBridge.swift ios/CCSUT/WebSessionCookies.swift
            ios/CCSUT/EcardSSOClient.swift ios/CCSUT/EcardSSOSession.swift
            ios/CCSUT/EcardPaymentPersistence.swift ios/CCSUT/EcardPaymentModel.swift)
          xcrun swiftc -g -parse-as-library "${SOURCES[@]}" "$RUNNER_TEMP/EcardPaymentModelTests.swift" -o "$RUNNER_TEMP/payment-model"
          if [ "$DIAGNOSTIC" = main-thread ]; then
            export DYLD_INSERT_LIBRARIES="$(xcode-select -p)/usr/lib/libMainThreadChecker.dylib"
            export MTC_CRASH_ON_REPORT=1
          else
            export DYLD_INSERT_LIBRARIES=/usr/lib/libgmalloc.dylib
          fi
          CCSUT_PAYMENT_REPETITIONS=10 python3 ios/Tests/run-payment-model-diagnostics.py "$RUNNER_TEMP/payment-model"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-crash-reports-${{ matrix.diagnostic }}
          path: ~/Library/Logs/DiagnosticReports/
