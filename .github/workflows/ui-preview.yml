name: UI preview

on:
  push:
    branches: [ui/navigation-timetable]
    paths:
      - 'ios/**'
      - '.github/workflows/ui-preview.yml'
  workflow_dispatch:
    inputs:
      render_catalog:
        description: 'Also render the full static preview catalog and compact-device screenshots'
        type: boolean
        default: true
      test_scope:
        description: 'Interaction checks to run (focused checks preserve full-suite failure evidence)'
        type: choice
        options: [all, refresh-and-search, refresh-navigation, refresh-feedback]
        default: all
      test_environment:
        description: 'Stable simulator or iOS 27.2 (logs the compatible device actually used)'
        type: choice
        options: [stable, ios-27-2]
        default: stable

jobs:
  preview:
    runs-on: ${{ inputs.test_environment == 'ios-27-2' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reported iOS 27.2 runtime
        if: ${{ inputs.test_environment == 'ios-27-2' }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ui-screenshots"
          sudo xcode-select --switch /Applications/Xcode_27.2.app
          xcodebuild -version
          xcodebuild -downloadPlatform iOS -buildVersion 27.2 -architectureVariant arm64
          xcrun simctl list runtimes
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/ui-screenshots/runtimes.json"
          xcrun simctl list devicetypes -j > "$RUNNER_TEMP/ui-screenshots/device-types.json"
          python3 -c '
          import json,re,sys
          runtimes=json.load(open(sys.argv[1]))["runtimes"]
          matches=[r for r in runtimes if r.get("isAvailable") and r.get("version")=="27.2"]
          if len(matches)!=1: raise SystemExit("Expected one available iOS 27.2 runtime: " + repr(matches))
          runtime=matches[0]
          types=json.load(open(sys.argv[2]))["devicetypes"]
          allowed={t["identifier"] for t in runtime.get("supportedDeviceTypes",[])}
          suffix=re.search(r"iPhone(\d+)-(\d+)$",runtime["identifier"])
          model=("iPhone"+suffix[1]+","+suffix[2]) if suffix else None
          compatible=[t for t in types if t.get("productFamily")=="iPhone" and
                      (t["identifier"] in allowed if allowed else
                       t.get("modelIdentifier")==model if model else t["name"]=="iPhone 15 Pro Max")]
          if not compatible: raise SystemExit("No compatible iPhone type: " + repr(runtime))
          device=next((t for t in compatible if t["name"]=="iPhone 15 Pro Max"),compatible[0])
          print("Selected simulator: " + device["name"] + "; runtime=" + runtime["identifier"])
          if device["name"]!="iPhone 15 Pro Max":
              print("Reported physical model is iPhone 15 Pro Max; this runtime does not support that simulator type.")
          json.dump({"runtime":runtime["identifier"],"device":device["identifier"],"name":device["name"]},open(sys.argv[3],"w"))
          ' "$RUNNER_TEMP/ui-screenshots/runtimes.json" "$RUNNER_TEMP/ui-screenshots/device-types.json" "$RUNNER_TEMP/ui-screenshots/selected-simulator.json"
          RUNTIME=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["runtime"])' "$RUNNER_TEMP/ui-screenshots/selected-simulator.json")
          DEVICE_TYPE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["device"])' "$RUNNER_TEMP/ui-screenshots/selected-simulator.json")
          DEVICE=$(xcrun simctl create 'CCSUT iOS 27.2 refresh diagnosis' "$DEVICE_TYPE" "$RUNTIME")
          echo "CCSUT_PREVIEW_DEVICE=$DEVICE" >> "$GITHUB_ENV"
      - name: Test timetable presentation
        run: |
          xcrun swiftc -parse-as-library ios/CCSUT/Models.swift ios/CCSUT/SchedulePresentation.swift ios/Tests/SchedulePresentationTests.swift -o "$RUNNER_TEMP/schedule-tests"
          "$RUNNER_TEMP/schedule-tests"
          xcrun swiftc -parse-as-library ios/CCSUT/InterfacePreview.swift ios/Tests/ReleasePreviewTests.swift -o "$RUNNER_TEMP/release-preview-tests"
          "$RUNNER_TEMP/release-preview-tests" --preview-ui --preview-page academic
      - name: Build simulator app
        run: |
          set -o pipefail
          xcodebuild build -project ios/CCSUT.xcodeproj -scheme CCSUT -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/UIPreview" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ui-build.log"
      - name: Prepare native simulator
        id: simulator
        timeout-minutes: 10
        run: bash ios/Tests/render-preview.sh --boot-only
      - name: Preserve simulator boot state
        if: failure()
        run: xcrun simctl list devices > "$RUNNER_TEMP/ui-screenshots/simulator-state.txt"
      - name: Verify initial and selected week positioning
        if: ${{ inputs.test_scope != 'refresh-and-search' && inputs.test_scope != 'refresh-navigation' && inputs.test_scope != 'refresh-feedback' }}
        run: |
          set -o pipefail
          xcodebuild test -project ios/CCSUT.xcodeproj -scheme CCSUTUI -configuration Debug \
            -destination "platform=iOS Simulator,id=$CCSUT_PREVIEW_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/UIPreview" -resultBundlePath "$RUNNER_TEMP/ui-week-tests.xcresult" \
            -only-testing:CCSUTUITests/PageInteractionUITests/testSemesterAndWeekdaysMoveWithCourses \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ui-week-test.log"
      - name: Export week positioning screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/ui-week-tests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui-week-tests.xcresult" --output-path "$RUNNER_TEMP/ui-week-test-attachments"
          fi
      - name: Publish week positioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CCSUT-week-positioning
          path: |
            ${{ runner.temp }}/ui-week-test.log
            ${{ runner.temp }}/ui-week-test-attachments/*.png
            ${{ runner.temp }}/ui-week-test-attachments/*.txt
            ${{ runner.temp }}/ui-week-test-attachments/manifest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify native page interactions
        if: ${{ !cancelled() && steps.simulator.conclusion == 'success' }}
        env:
          TEST_SCOPE: ${{ inputs.test_scope }}
        run: |
          set -o pipefail
          xcrun simctl io "$CCSUT_PREVIEW_DEVICE" recordVideo --codec=h264 "$RUNNER_TEMP/ui-screenshots/native-interactions.mp4" &
          VIDEO_PID=$!
          trap 'kill -INT "$VIDEO_PID"; wait "$VIDEO_PID" || true' EXIT
          TEST_SELECTION=(-skip-testing:CCSUTUITests/PageInteractionUITests/testSemesterAndWeekdaysMoveWithCourses)
          if [ "$TEST_SCOPE" = 'refresh-and-search' ]; then
            TEST_SELECTION=(
              -only-testing:CCSUTUITests/PageInteractionUITests/testAcademicPagesPullToRefreshIncludingEmptyStates
              -only-testing:CCSUTUITests/PageInteractionUITests/testPullingTimetableRefreshesWholePageOnce
              -only-testing:CCSUTUITests/PageInteractionUITests/testElectiveEmptySearchCanResetAndDisabledReasonIsVisible
              -only-testing:CCSUTUITests/PageInteractionUITests/testLargeTextKeepsAcademicControlsAccessible
            )
          fi
          if [ "$TEST_SCOPE" = 'refresh-navigation' ]; then
            TEST_SELECTION=(
              -only-testing:CCSUTUITests/PageInteractionUITests/testAcademicPagesPullToRefreshIncludingEmptyStates
              -only-testing:CCSUTUITests/PageInteractionUITests/testPullingTimetableRefreshesWholePageOnce
              -only-testing:CCSUTUITests/PageInteractionUITests/testLongAcademicListsPullToRefresh
              -only-testing:CCSUTUITests/PageInteractionUITests/testScoresRefreshAfterSwitchingFromTimetable
              -only-testing:CCSUTUITests/PageInteractionUITests/testExamsRefreshAfterSwitchingFromTimetable
              -only-testing:CCSUTUITests/PageInteractionUITests/testElectivesRefreshAfterSwitchingFromTimetable
            )
          fi
          if [ "$TEST_SCOPE" = 'refresh-feedback' ]; then
            TEST_SELECTION=(
              -only-testing:CCSUTUITests/PageInteractionUITests/testScoreRefreshControlRemainsActiveDuringSlowLoad
            )
          fi
          xcodebuild test -project ios/CCSUT.xcodeproj -scheme CCSUTUI -configuration Debug \
            -destination "platform=iOS Simulator,id=$CCSUT_PREVIEW_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/UIPreview" -resultBundlePath "$RUNNER_TEMP/ui-tests.xcresult" \
            "${TEST_SELECTION[@]}" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ui-test.log"
      - name: Export interaction screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/ui-tests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui-tests.xcresult" --output-path "$RUNNER_TEMP/ui-test-attachments"
          fi
      - name: Publish interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CCSUT-ui-interactions
          path: |
            ${{ runner.temp }}/ui-test.log
            ${{ runner.temp }}/ui-test-attachments/*.png
            ${{ runner.temp }}/ui-test-attachments/*.txt
            ${{ runner.temp }}/ui-test-attachments/manifest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Render preview screens
        if: ${{ !cancelled() && steps.simulator.conclusion == 'success' && inputs.render_catalog != false }}
        run: bash ios/Tests/render-preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CCSUT-ui-preview
          path: |
            ${{ runner.temp }}/ui-screenshots/
            ${{ runner.temp }}/ui-build.log
            ${{ runner.temp }}/ui-week-test.log
            ${{ runner.temp }}/ui-week-tests.xcresult/
            ${{ runner.temp }}/ui-week-test-attachments/
            ${{ runner.temp }}/ui-test.log
            ${{ runner.temp }}/ui-tests.xcresult/
            ${{ runner.temp }}/ui-test-attachments/
          if-no-files-found: error
          retention-days: 14
