name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      note:
        description: '构建备注'
        required: false
        default: ''
      login_probe_only:
        description: 'Run only the focused production login independence regression'
        type: boolean
        default: false

concurrency:
  group: ios-build-${{ github.ref }}-${{ inputs.login_probe_only && 'login' || 'package' }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & Package
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== 可用 Xcode ==="
          ls -1d /Applications/Xcode*.app 2>/dev/null | sort -V || true
          LATEST=$(ls -1d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "选中: $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

          echo "=== 检查 iOS 平台 ==="
          if ! xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            echo "iOS SDK 缺失，开始下载（首次可能 5-10 分钟）"
            sudo xcodebuild -downloadPlatform iOS || true
          fi
          xcrun --sdk iphoneos --show-sdk-version || echo "仍无 iOS SDK"

      - name: Show project
        if: ${{ !inputs.login_probe_only }}
        working-directory: ios
        run: |
          xcodebuild -project CCSUT.xcodeproj -list || true

      - name: Verify login independently of elective availability
        if: ${{ inputs.login_probe_only }}
        run: |
          set -o pipefail
          python3 ios/Tests/run-login-state-tests.py 2>&1 | tee "$RUNNER_TEMP/login-state-tests.log"
          node --test ios/Tests/login-script.test.mjs ios/Tests/cas-script.test.mjs \
            ios/Tests/campus-web-privacy.test.mjs 2>&1 | tee "$RUNNER_TEMP/login-script-tests.log"
          xcrun swiftc -parse-as-library \
            ios/CCSUT/Session.swift ios/CCSUT/API.swift ios/CCSUT/APIResponse.swift ios/CCSUT/Models.swift \
            ios/CCSUT/EnrolledCourses.swift ios/CCSUT/ElectiveState.swift \
            ios/CCSUT/AcademicAPI.swift ios/CCSUT/AcademicCalendar.swift ios/CCSUT/SchedulePresentation.swift \
            ios/CCSUT/EcardAPI.swift ios/CCSUT/EcardTokenBridge.swift ios/CCSUT/WebSessionCookies.swift \
            ios/CCSUT/EcardSSOClient.swift ios/CCSUT/EcardSSOSession.swift \
            ios/Tests/LoginSelectionClosureTests.swift -o "$RUNNER_TEMP/login-tests"
          "$RUNNER_TEMP/login-tests" 2>&1 | tee "$RUNNER_TEMP/login-tests.log"
          xcrun swiftc -parse-as-library \
            ios/CCSUT/APIResponse.swift ios/CCSUT/Models.swift ios/Tests/StudentIdentityTests.swift \
            -o "$RUNNER_TEMP/identity-tests"
          "$RUNNER_TEMP/identity-tests" 2>&1 | tee "$RUNNER_TEMP/identity-tests.log"
      - name: Upload focused login evidence
        if: ${{ always() && inputs.login_probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: login-independence-evidence
          path: |
            ${{ runner.temp }}/login-tests.log
            ${{ runner.temp }}/identity-tests.log
            ${{ runner.temp }}/login-state-tests.log
            ${{ runner.temp }}/login-script-tests.log
          if-no-files-found: ignore
      - name: Build (unsigned)
        if: ${{ !inputs.login_probe_only }}
        working-directory: ios
        run: |
          set -o pipefail
          # 用 build 而不是 archive：archive 对签名要求更严，未签名时常报
          # "Code signing is required for product type 'Application'"
          xcodebuild build \
            -project CCSUT.xcodeproj \
            -scheme CCSUT \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$RUNNER_TEMP/build.log"
        continue-on-error: false

      - name: Package unsigned IPA
        if: ${{ success() && !inputs.login_probe_only }}
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/CCSUT.app"
          if [ ! -d "$APP" ]; then
            echo "找不到 CCSUT.app，列出构建产物："
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name "*.app" || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -qry CCSUT-unsigned.ipa Payload

          echo "=== 产物 ==="
          ls -lh CCSUT-unsigned.ipa
          unzip -l CCSUT-unsigned.ipa | head -n 20

          # 记录版本信息，方便对照
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"

      - name: Upload IPA
        if: ${{ success() && !inputs.login_probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: CCSUT-ipa
          path: ${{ runner.temp }}/CCSUT-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: ${{ failure() && !inputs.login_probe_only }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 7
          if-no-files-found: ignore
